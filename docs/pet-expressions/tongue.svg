<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Xhpy · 吐舌头 Tongue Out"><title>Xhpy · 吐舌头 Tongue Out</title><desc>Xhpy 的 吐舌头 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-sway 2.0s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
