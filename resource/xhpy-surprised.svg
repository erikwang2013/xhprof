<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">Xhpy（惊讶）- xhprof 项目宠物</title>
  <desc id="d">火焰小精灵 Xhpy 的惊讶表情变体：瞪大双眼、扬起眉毛、张成圆形的小嘴，双手举得更高。</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC94F"/>
      <stop offset=".55" stop-color="#FF9438"/>
      <stop offset="1" stop-color="#F04E2A"/>
    </linearGradient>
  </defs>

  <!-- 地面阴影 -->
  <ellipse cx="256" cy="442" rx="118" ry="14" fill="#5C2A16" opacity=".12"/>

  <!-- 小火星 -->
  <circle cx="138" cy="198" r="5" fill="#FFC94F"/>
  <circle cx="392" cy="240" r="4" fill="#FF8F3C"/>

  <!-- 小脚 -->
  <ellipse cx="212" cy="428" rx="19" ry="11.5" fill="#F2502C"/>
  <ellipse cx="300" cy="428" rx="19" ry="11.5" fill="#F2502C"/>

  <!-- 小短手（举得更高） -->
  <path d="M136 336 C 120 322 108 306 104 290" fill="none" stroke="#F2502C" stroke-width="15" stroke-linecap="round"/>
  <path d="M376 336 C 392 322 404 306 408 290" fill="none" stroke="#F2502C" stroke-width="15" stroke-linecap="round"/>

  <!-- 火焰身体 -->
  <path d="M252 78 C 228 128 168 166 148 240 C 132 300 130 344 150 380 C 172 448 340 448 362 380 C 382 344 380 300 364 242 C 342 168 284 132 268 104 C 262 90 258 82 252 78 Z" fill="url(#body)"/>

  <!-- 脸：瞪大的眼睛 + 扬起的眉毛 -->
  <path d="M200 268 Q 216 258 232 268" fill="none" stroke="#4A1D0D" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M280 268 Q 296 258 312 268" fill="none" stroke="#4A1D0D" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="216" cy="300" rx="17" ry="22" fill="#4A1D0D"/>
  <circle cx="209" cy="289" r="7" fill="#fff"/>
  <circle cx="222" cy="310" r="3" fill="#fff" opacity=".8"/>
  <ellipse cx="296" cy="300" rx="17" ry="22" fill="#4A1D0D"/>
  <circle cx="289" cy="289" r="7" fill="#fff"/>
  <circle cx="302" cy="310" r="3" fill="#fff" opacity=".8"/>
  <ellipse cx="184" cy="340" rx="20" ry="11" fill="#F693A6" opacity=".9"/>
  <ellipse cx="328" cy="340" rx="20" ry="11" fill="#F693A6" opacity=".9"/>
  <ellipse cx="256" cy="344" rx="8.5" ry="11" fill="#4A1D0D"/>
</svg>
