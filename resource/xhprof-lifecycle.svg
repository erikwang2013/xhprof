<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="ttl desc">
  <title id="ttl">xhprof 生命周期 — 一次请求的数据流</title>
  <desc id="desc">生命周期：扩展加载 → 请求开始 → xhprof_enable() → 运行期采集 → xhprof_disable() → 原始数组 → save_run 落盘 → 报表读取 get_run → 计算 → 渲染或导出 → 多 run 对比聚合回流。</desc>
  <style>
    text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','Noto Sans SC','Source Han Sans CN','PingFang SC','Microsoft YaHei',sans-serif}
    .mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace}
    .h1{font-size:21px;font-weight:700;fill:#1c2b4a}
    .sub{font-size:12px;fill:#4c6cb5}
    .ph{font-size:11.5px;font-weight:700;fill:#3b5998}
    .tt{font-size:12px;font-weight:600;fill:#1c2b4a}
    .mt{font-size:11px;font-weight:600;fill:#1c2b4a}
    .tx{font-size:9.5px;fill:#4c6cb5}
    .mn{font-size:9.5px;fill:#3b5998}
    .num{font-size:9px;font-weight:700;fill:#ffffff}
    .dep{font-size:10px;fill:#4c6cb5}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#1c2b4a"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#ff8b3d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="440" rx="16" fill="#ffffff" stroke="#c3d9ff"/>

  <text class="h1" x="32" y="42">生命周期 · Lifecycle</text>
  <text class="sub" x="32" y="64">一次请求的数据流：加载 → 启用 → 采集 → 落盘 → 消费 → 对比回流</text>

  <!-- ============ 采集侧 ============ -->
  <text class="ph" x="24" y="92">采集侧 · Producer（C 扩展内）</text>

  <rect x="24" y="100" width="160" height="72" rx="8" fill="#eef3fb" stroke="#3b5998"/>
  <circle cx="168" cy="112" r="8" fill="#3b5998"/><text class="num" x="168" y="115.5" text-anchor="middle">1</text>
  <text class="tt" x="38" y="126">扩展加载</text>
  <text class="mn mono" x="38" y="144">MINIT 注册 observer</text>
  <text class="tx" x="38" y="160">读 xhprof.profiler 门控</text>

  <path d="M184 136 H218" fill="none" stroke="#1c2b4a" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="222" y="100" width="160" height="72" rx="8" fill="#eef3fb" stroke="#3b5998"/>
  <circle cx="366" cy="112" r="8" fill="#3b5998"/><text class="num" x="366" y="115.5" text-anchor="middle">2</text>
  <text class="tt" x="236" y="126">请求开始</text>
  <text class="tx" x="236" y="144">auto_enable 自动开启</text>
  <text class="tx" x="236" y="160">或由业务代码手动调用</text>

  <path d="M382 136 H416" fill="none" stroke="#1c2b4a" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="420" y="100" width="160" height="72" rx="8" fill="#eef3fb" stroke="#3b5998"/>
  <circle cx="564" cy="112" r="8" fill="#3b5998"/><text class="num" x="564" y="115.5" text-anchor="middle">3</text>
  <text class="mono mt" x="434" y="127">xhprof_enable()</text>
  <text class="tx" x="434" y="144">标记采集起点</text>
  <text class="mn mono" x="434" y="160">XHPROF_FLAGS_* 选指标</text>

  <path d="M580 136 H614" fill="none" stroke="#1c2b4a" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="618" y="100" width="160" height="72" rx="8" fill="#eef3fb" stroke="#3b5998"/>
  <circle cx="762" cy="112" r="8" fill="#3b5998"/><text class="num" x="762" y="115.5" text-anchor="middle">4</text>
  <text class="tt" x="632" y="126">运行期采集</text>
  <text class="tx" x="632" y="144">fcall begin / end 配对</text>
  <text class="mn mono" x="632" y="160">wt ct cpu mu pmu 累加</text>

  <path d="M778 136 H812" fill="none" stroke="#1c2b4a" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="816" y="100" width="160" height="72" rx="8" fill="#eef3fb" stroke="#3b5998"/>
  <circle cx="960" cy="112" r="8" fill="#3b5998"/><text class="num" x="960" y="115.5" text-anchor="middle">5</text>
  <text class="mono mt" x="830" y="127">xhprof_disable()</text>
  <text class="tx" x="830" y="144">停止采集</text>
  <text class="tx" x="830" y="160">返回 caller==&gt;callee 数组</text>

  <!-- ============ 折返连接 ============ -->
  <path d="M896 172 V214 H662" fill="none" stroke="#1c2b4a" stroke-width="1.6"/>
  <path d="M352 214 H104 V266" fill="none" stroke="#1c2b4a" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="358" y="203" width="298" height="22" rx="8" fill="#eef3fb" stroke="#c3d9ff"/>
  <text class="ph" x="507" y="218" text-anchor="middle">消费侧 · Consumer —— 落盘后由 PHP 报表读取</text>

  <!-- ============ 消费侧 ============ -->
  <rect x="24" y="272" width="160" height="72" rx="8" fill="#ffffff" stroke="#c3d9ff"/>
  <circle cx="168" cy="284" r="8" fill="#4c6cb5"/><text class="num" x="168" y="287.5" text-anchor="middle">6</text>
  <text class="tt" x="38" y="299">落盘与读回</text>
  <text class="mn mono" x="38" y="316">save_run() 写 output_dir</text>
  <text class="mn mono" x="38" y="332">get_run() 按 run id 读回</text>

  <path d="M184 308 H218" fill="none" stroke="#1c2b4a" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="222" y="272" width="160" height="72" rx="8" fill="#ffffff" stroke="#c3d9ff"/>
  <circle cx="366" cy="284" r="8" fill="#4c6cb5"/><text class="num" x="366" y="287.5" text-anchor="middle">7</text>
  <text class="tt" x="236" y="299">计算</text>
  <text class="tx" x="236" y="316">flat 平铺 · parent/child</text>
  <text class="tx" x="236" y="332">diff 对比 · aggregate 聚合</text>

  <path d="M382 308 H416" fill="none" stroke="#1c2b4a" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="420" y="272" width="160" height="72" rx="8" fill="#ffffff" stroke="#c3d9ff"/>
  <circle cx="564" cy="284" r="8" fill="#4c6cb5"/><text class="num" x="564" y="287.5" text-anchor="middle">8</text>
  <text class="tt" x="434" y="299">渲染 UI</text>
  <text class="tx" x="434" y="316">xhprof_html 页面</text>
  <text class="tx" x="434" y="332">flat · 调用图 · 近似火焰图</text>

  <path d="M580 308 H614" fill="none" stroke="#1c2b4a" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="618" y="272" width="160" height="72" rx="8" fill="#ffffff" stroke="#c3d9ff"/>
  <circle cx="762" cy="284" r="8" fill="#4c6cb5"/><text class="num" x="762" y="287.5" text-anchor="middle">9</text>
  <text class="tt" x="632" y="299">导出 / CLI</text>
  <text class="tx" x="632" y="316">callgrind · JSON · CSV</text>
  <text class="mn mono" x="632" y="332">xhprof-diff 回归门禁</text>

  <path d="M778 308 H812" fill="none" stroke="#1c2b4a" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="816" y="272" width="160" height="72" rx="8" fill="#ffffff" stroke="#c3d9ff"/>
  <circle cx="960" cy="284" r="8" fill="#4c6cb5"/><text class="num" x="960" y="287.5" text-anchor="middle">10</text>
  <text class="tt" x="830" y="299">多 run 对比</text>
  <text class="tx" x="830" y="316">选两次运行做 DIFF</text>
  <text class="tx" x="830" y="332">排序定位性能劣化</text>

  <!-- ============ 回流 ============ -->
  <path d="M896 344 V378 H302 V348" fill="none" stroke="#ff8b3d" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ad)"/>
  <text class="dep" x="599" y="372" text-anchor="middle">多 run 对比 / 聚合回流 —— 把结果重新交给计算层（diff · aggregate）</text>

  <!-- ============ 图例 ============ -->
  <circle cx="28" cy="411" r="4.5" fill="#2e7d52"/>
  <text class="dep" x="40" y="415">精确模式 xhprof_enable()（默认，逐调用计时）</text>
  <circle cx="368" cy="411" r="4.5" fill="#ff8b3d"/>
  <text class="dep" x="380" y="415">采样模式 xhprof_sample_enable()（按 xhprof.sampling_interval 定时）</text>
  <circle cx="800" cy="411" r="4.5" fill="#4c6cb5"/>
  <text class="dep" x="812" y="415">虚线 = 回流 / 复用</text>
</svg>
